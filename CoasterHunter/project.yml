# XcodeGen project definition.
#
# Generated rather than hand-written: a .xcodeproj is 2,000 lines of UUIDs that
# cannot be reviewed or merged, and could not be verified on a machine without
# Xcode. Run `xcodegen generate` to produce CoasterHunter.xcodeproj.
#
#   brew install xcodegen && xcodegen generate && open CoasterHunter.xcodeproj

name: CoasterHunter
options:
  bundleIdPrefix: com.coasterhunter
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # set once enrolled in the Developer Program
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CoasterHunterCore:
    path: Packages/CoasterHunterCore

targets:

  CoasterHunter:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/Configuration.storekit"]
      - path: App/Resources/Configuration.storekit
        buildPhase: none
      # 7 MB, read-only, built by ../pipeline. Bundling it means the app works
      # on the first launch with no network — park signal is famously bad.
      - path: App/Resources/coasterhunter-seed.sqlite
        buildPhase: resources
    dependencies:
      - package: CoasterHunterCore
      - target: CoasterHunterWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coasterhunter.app
        INFOPLIST_KEY_CFBundleDisplayName: CoasterHunter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Both strings are user-facing and explain the actual reason — vague
        # permission copy is a common reason for App Review rejection.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          CoasterHunter uses motion data to measure the g-force, airtime and
          inversions of the rides you go on.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          CoasterHunter uses your location to check you into a park and to sort
          attractions by how close you are.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          CoasterHunter reads your step count so your park day shows how far you
          actually walked.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          CoasterHunter saves your park day to Health as a workout.

  CoasterHunterWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - path: App/DesignSystem/Theme.swift
    dependencies:
      - package: CoasterHunterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coasterhunter.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: CoasterHunter
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.coasterhunter.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          CoasterHunter uses motion data to measure the g-force, airtime and
          inversions of the rides you go on.

schemes:
  CoasterHunter:
    build:
      targets:
        CoasterHunter: all
    run:
      config: Debug
      # Lets all three products be bought and tested in the Simulator with no
      # App Store Connect account.
      storeKitConfiguration: App/Resources/Configuration.storekit
    test:
      config: Debug
      targets:
        - package: CoasterHunterCore/CoasterHunterCoreTests
